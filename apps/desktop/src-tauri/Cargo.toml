[package]
name = "kairos-desktop"
version = "0.1.0"
description = "Kairos - Intelligent Chinese Immersion Engine"
authors = ["Kairos Team"]
license = "MIT"
repository = "https://github.com/kairos-lang/kairos"
edition = "2021"

[lib]
name = "kairos_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
regex = "1"
once_cell = "1"
encoding_rs = "0.8"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
