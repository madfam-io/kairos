[project]
name = "kairos-simplify"
version = "0.1.0"
description = "AI-powered Chinese sentence simplification service using Qwen2.5"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "orjson>=3.9.0",
    "redis>=5.0.0",
    "structlog>=24.1.0",
    "tiktoken>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]
modal = [
    "modal>=0.64.0",
    "transformers>=4.44.0",
    "torch>=2.4.0",
    "accelerate>=0.34.0",
    "vllm>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
